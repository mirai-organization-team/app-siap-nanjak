<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siap Nanjak</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4D3A">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#EDF0EB;--surface:#FFFFFF;--ink:#15201A;--muted:#56655C;--line:#D3DBD3;
  --pine:#1F4D3A;--pine2:#2C6A50;--blaze:#E2642A;
  --red:#B8352A;--redbg:#FBE8E5;--amber:#A86F07;--amberbg:#FCF1D8;--green:#257A4B;--greenbg:#E3F3E9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111814;--surface:#1B2520;--ink:#EAF0EB;--muted:#9FB0A5;--line:#2E3C34;
  --pine:#1B4533;--pine2:#2F7356;--blaze:#F07A42;
  --red:#F08A7E;--redbg:#3A1E1B;--amber:#F0C35A;--amberbg:#352A12;--green:#6FD39B;--greenbg:#16301F;}}
:root[data-theme="dark"]{
  --bg:#111814;--surface:#1B2520;--ink:#EAF0EB;--muted:#9FB0A5;--line:#2E3C34;
  --pine:#1B4533;--pine2:#2F7356;--blaze:#F07A42;
  --red:#F08A7E;--redbg:#3A1E1B;--amber:#F0C35A;--amberbg:#352A12;--green:#6FD39B;--greenbg:#16301F;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.05;margin:0}
h2{font-size:1.6rem;margin-bottom:10px}
h3{font-size:1.2rem;margin:18px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blaze);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px}
.stack{display:grid;gap:12px}
.btn{border:0;border-radius:12px;min-height:50px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--pine);color:#fff}
.btn.pri:active{background:var(--pine2)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn.blaze{background:var(--blaze);color:#fff}
.btn.full{width:100%}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.fld{display:grid;gap:4px;font-weight:600;font-size:.95rem}
.fld input,.fld select,.fld textarea{font:inherit;font-weight:400;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* topo header */
.top{position:relative;background:var(--pine);color:#fff;overflow:hidden}
.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.22;pointer-events:none}
.top .wrap{position:relative;padding-top:20px;padding-bottom:22px}
.hdr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hdr-sub{font-size:.9rem;opacity:.85;margin:0 0 2px}
.top h1{font-size:2.3rem;letter-spacing:.01em;word-break:break-word}
.hdr-meta{margin:6px 0 0;opacity:.9}
.codechip{background:rgba(255,255,255,.14);border:1.5px dashed rgba(255,255,255,.6);color:#fff;border-radius:10px;padding:8px 10px;font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;letter-spacing:.12em;flex:none}

/* onboarding */
.ob-hero{position:relative;background:var(--pine);color:#fff;overflow:hidden;min-height:260px;display:flex;align-items:flex-end}
.ob-in{position:relative;max-width:720px;margin:0 auto;width:100%;padding:28px 16px 26px}
.ob-in h1{font-size:3.4rem}
.ob-in p{max-width:30em;opacity:.92;margin-top:8px}
.opt{display:grid;gap:2px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.opt b{font-size:1.1rem}
.opt span{color:var(--muted);font-size:.95rem}
.opt:active{border-color:var(--pine)}

/* tabs & nav */
main{padding-bottom:96px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.bottom button{background:none;border:0;padding:8px 4px 10px;display:grid;justify-items:center;gap:2px;font-size:.8rem;color:var(--muted);min-height:60px}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button[aria-current="true"]{color:var(--pine2);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.bottom button[aria-current="true"]{color:var(--green)}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:9px;min-height:42px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--pine);color:#fff}

/* progress */
.prog{margin:4px 0 14px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.prog-t{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:6px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.92rem;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* item rows */
.grp{margin-top:16px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;font-family:"Barlow Condensed",sans-serif;font-size:1.15rem;font-weight:700;margin:0 2px 6px}
.grp-h small{font-family:Barlow,sans-serif;font-weight:400;font-size:.85rem;color:var(--muted)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chk{flex:none;width:56px;background:none;border:0;display:grid;place-items:center}
.chk span{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center}
.row.packed .chk span{background:var(--green);border-color:var(--green)}
.chk svg{width:18px;height:18px;opacity:0}
.row.packed .chk svg{opacity:1}
.rowmain{flex:1;min-width:0;background:none;border:0;text-align:left;padding:10px 12px 10px 0;display:flex;align-items:center;gap:10px}
.rowmain img{width:42px;height:42px;border-radius:8px;object-fit:cover;flex:none}
.rt{min-width:0;flex:1}
.rn{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.packed .rn{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.rm{display:block;font-size:.88rem;color:var(--muted)}
.tag{flex:none;font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--amberbg);color:var(--amber)}
.tag.dup{background:var(--redbg);color:var(--red)}
.ro .row .rowmain{padding-left:14px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:999px;min-height:56px;padding:0 22px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* team */
.codebig{font-family:"Barlow Condensed",sans-serif;font-size:2.4rem;letter-spacing:.18em;font-weight:700;color:var(--pine2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .codebig{color:var(--green)}}
.mem{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mem:first-of-type{border-top:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.wt{display:grid;gap:10px}
.wt-row{display:grid;grid-template-columns:minmax(70px,1fr) 3fr auto;gap:10px;align-items:center;font-size:.95rem}
.wt-row .bar{height:12px}
.wt-row .bar i{background:var(--blaze)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.total b{font-family:"Barlow Condensed",sans-serif;font-size:1.8rem}

/* standards */
.std{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.std:first-child{border-top:0}
.dot{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:.95rem}
.st-red .dot{background:var(--redbg);color:var(--red)}
.st-yellow .dot{background:var(--amberbg);color:var(--amber)}
.st-green .dot{background:var(--greenbg);color:var(--green)}
.st-gray .dot{background:var(--bg);color:var(--muted)}
.std .rt small{display:block;color:var(--muted);font-size:.86rem}
.st-red .rt small{color:var(--red)}
.st-yellow .rt small{color:var(--amber)}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sum3 div{border-radius:12px;padding:10px;text-align:center}
.sum3 b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.8rem;line-height:1}
.note{background:var(--amberbg);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.92rem}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
details summary{font-weight:600;cursor:pointer}
details ul{margin:10px 0 0;padding-left:20px}
details li{margin-bottom:6px}

/* qr */
.qrbox{background:#fff;border-radius:16px;padding:18px;display:grid;justify-items:center;gap:10px;color:#15201A}
.qrbox img,.qrbox canvas{max-width:100%;height:auto!important}
.qrbox .qn{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;font-weight:700;text-align:center}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,14,.55)}
.dlg{padding:18px;display:grid;gap:12px}
.dlg-h{display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:1.6rem;width:44px;height:44px}
.check{display:flex;align-items:center;gap:10px;font-weight:500;min-height:44px}
.check input{width:24px;height:24px;accent-color:var(--pine)}
.photo-prev{display:flex;align-items:center;gap:10px}
.photo-prev img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:.95rem;z-index:20;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* home & navigation */
.backbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:6px 14px 6px 8px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:4px;margin-bottom:12px;min-height:40px}
.backbtn:active{background:rgba(255,255,255,.26)}
.ob-hero.slim{min-height:0}
.ob-hero.slim h1{font-size:2.4rem}
.trip{display:grid;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.trip:active{border-color:var(--pine2)}
.trip-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.trip-top b{font-family:"Barlow Condensed",sans-serif;font-size:1.4rem;line-height:1.1}
.role{font-size:.78rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--greenbg);color:var(--green);flex:none}
.trip .bar{height:8px}
.idcard{display:flex;gap:14px;align-items:flex-start}
.av.lg{width:52px;height:52px;font-size:1.3rem}
.plan-dur{margin:0;font-weight:600;color:var(--pine2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .plan-dur{color:var(--green)}}

/* v4 additions */
.btn[disabled]{opacity:.45;cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:54px;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1.6rem;font-weight:600;flex:none}
.stepper button:active{background:var(--bg)}
#dVal{flex:1;text-align:center;font-weight:600;font-size:1.05rem}
.plan-dur.err{color:var(--red)}
.req{color:var(--red);font-weight:700}
.sec-h{font-size:1.15rem;margin:10px 0 -2px;padding-top:10px;border-top:1px solid var(--line)}
.dlg-foot{position:sticky;bottom:0;background:var(--surface);padding:10px 0 4px;margin-top:4px}
.note.warn{background:var(--redbg)}
.sarcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--blaze);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:1.3rem}
.sarcard .rt small{display:block;font-size:.88rem;color:var(--muted)}
.sarcard .rt b{font-size:1rem}
.sar-ic{width:40px;height:40px;border-radius:10px;background:var(--blaze);color:#fff;display:grid;place-items:center;flex:none}
.photo-acts{display:flex;flex-wrap:wrap;gap:8px}
.photo-prev{align-items:flex-start}
.outfit{display:flex;gap:14px;align-items:flex-start}
.outfit img,.outfit .ph-empty{width:110px;height:146px;border-radius:12px;object-fit:cover;flex:none}
.ph-empty{background:var(--bg);color:var(--muted);display:grid;place-items:center;align-content:center;gap:4px;font-size:.8rem;text-align:center}
.sar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.sar-tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;display:grid;gap:4px}
.sar-tile img,.sar-tile .ph-empty{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover}
.sar-tile b{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sar-tile small{font-size:.82rem;color:var(--muted)}
.sar-tile small.miss{color:var(--red)}
.sar-prev{width:100%;border-radius:12px;border:1px solid var(--line);margin-top:14px}

/* v5: alur & tampilan */
.step-lbl{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--blaze);margin:0 0 2px}
.next-wrap{margin-top:22px}
.next{gap:6px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:.78rem;margin-left:4px}
.seg button[aria-pressed="true"] .badge{background:#fff;color:var(--red)}
.pills{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.pills button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.92rem;color:var(--muted)}
.pills button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.inp{font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;width:100%}
/* nav */
nav.bottom button{font-size:.76rem}
.nav-ic{position:relative;display:grid}
.nav-ok{position:absolute;right:-7px;top:-4px;width:13px;height:13px;border-radius:50%;background:var(--green);border:2px solid var(--surface)}
/* rencana */
.seg-sm{display:inline-grid;grid-template-columns:auto auto;width:auto;margin:0;justify-self:start}
.seg-sm button{min-height:38px;padding:0 16px;font-size:.92rem}
.dates{display:flex;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.dates:focus-within{border-color:var(--pine2)}
.dbox{flex:1;display:grid;padding:7px 12px 5px;min-width:0;cursor:pointer}
.dbox+.dbox{border-left:1.5px solid var(--line)}
.dbox small{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.dbox input{border:0;padding:2px 0;font:inherit;font-weight:500;background:transparent;color:var(--ink);width:100%;min-width:0;outline:none}
.dur{display:inline-flex;align-items:center;gap:2px;margin-top:8px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;justify-self:start}
.dur button{width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);font-size:1.15rem;font-weight:700;display:grid;place-items:center}
.dur #dVal{flex:none;padding:0 10px;font-weight:600;font-size:.92rem;min-width:0}
.plan-err{color:var(--red);margin:4px 0 0;font-size:.88rem;font-weight:500}
.plan-err:empty{display:none}
.mt-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;min-height:54px}
.mt-btn b{display:block;font-weight:600}
.mt-btn small{display:block;color:var(--muted);font-weight:400;font-size:.85rem}
.mt-dlg{max-height:calc(100vh - 60px);grid-template-rows:auto auto 1fr}
.mt-search{font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.mt-list{overflow-y:auto;max-height:60vh;margin:0 -18px;padding:0 18px}
.mt-prov{position:sticky;top:0;background:var(--surface);margin:0;padding:12px 0 6px;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mt-item{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;font-size:1rem}
.mt-item.on{color:var(--pine2);font-weight:600}
.mt-item span{font-size:.8rem;color:var(--green)}
/* isi barang */
.tag.sub{background:var(--bg);color:var(--muted)}
.tag.sub.ok{background:var(--greenbg);color:var(--green)}
.expand{flex:none;width:44px;background:none;border:0;color:var(--muted);font-size:.75rem}
.subs{display:grid;padding:2px 12px 8px 56px;border-top:1px dashed var(--line)}
.subs.ro{padding:0 14px 10px;font-size:.88rem;color:var(--muted);border-top:0;display:block}
.subrow{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:7px 0;font-size:.95rem}
.subrow.done{color:var(--muted);text-decoration:line-through}
.sbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.subrow.done .sbox{background:var(--green);border-color:var(--green)}
.sbox svg{width:14px;height:14px}
.sublist{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1.5px dashed var(--line);border-radius:10px;min-height:44px;align-items:center;font-weight:400}
.subchip{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border-radius:999px;padding:3px 4px 3px 12px;font-size:.92rem}
.subchip button{border:0;background:none;width:28px;height:28px;border-radius:50%;font-size:1.1rem;color:var(--muted)}
.subadd{display:flex;gap:8px}
.subadd input{flex:1;min-width:0}
/* berangkat */
.cklist .ck{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.cklist .ck:first-child{border-top:0}

function code8(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<8;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
const fmtW=g=>{g=+g||0;return g>=1000?(g/1000).toLocaleString("id-ID",{maximumFractionDigits:1})+" kg":Math.round(g)+" g"};
function fmtDate(d,short){try{return new Date(d+"T00:00:00").toLocaleDateString("id-ID",short?{day:"numeric",month:"short"}:{day:"numeric",month:"long",year:"numeric"})}catch(e){return d}}
const norm=s=>" "+String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim()+" ";
const hitName=(name,kw)=>{const n=norm(name);return kw.some(k=>n.includes(" "+k+" ")||n.includes(" "+k))};
const hit=(it,kw)=>hitName(it.name,kw)||(it.subs||[]).some(s=>hitName(s.n,kw));
const memName=id=>(S.members.find(m=>m.id===id)||{}).name||"?";
const initial=n=>esc((n||"?").trim().charAt(0).toUpperCase());

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2800)}
function ask(msg,yes="Ya"){return new Promise(res=>{const d=$("#askDlg");$("#askMsg").textContent=msg;$("#askYes").textContent=yes;

/* ---------- rencana: tipe & tanggal ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const fullDate=v=>!!v&&+v.slice(0,4)>=1900; // tahun sudah lengkap diketik
function dayCount(t){if(t.type!=="multi"||!t.start||!t.end)return 1;return Math.round((new Date(t.end+"T00:00:00")-new Date(t.start+"T00:00:00"))/864e5)+1}
function planTxt(t){
  const label=t.type==="oneday"?"Tektok 1 hari":"Menginap";
  if(!t.start)return label+", tanggal belum diatur";
  if(t.type!=="multi")return label+", "+fmtDate(t.start);
  if(!t.end)return "Mulai "+fmtDate(t.start)+", tanggal turun belum diatur";
  const n=dayCount(t);if(n<2)return "Tanggal turun belum sesuai";
  return `${n} hari ${n-1} malam, ${fmtDate(t.start,true)} sampai ${fmtDate(t.end)}`;
}
function planError(p){
  if(p.start&&fullDate(p.start)&&p.start<today())return `Tanggal ${p.type==="multi"?"naik":"pendakian"} sudah lewat. Pilih hari ini atau setelahnya.`;
  if(p.type==="multi"&&p.end&&fullDate(p.end)){
    if(p.end<today())return "Tanggal turun sudah lewat.";
    if(p.start&&p.end<=p.start)return "Tanggal turun minimal 1 hari setelah tanggal naik.";
  }
  return "";
}
function planHTML(t){const multi=t.type!=="oneday",n=Math.max(2,dayCount(t));
  return `<div class="fld">Tipe pendakian<div class="seg seg-sm"><button type="button" data-ptype="oneday" aria-pressed="${!multi}">Tektok (1 hari)</button><button type="button" data-ptype="multi" aria-pressed="${multi}">Menginap</button></div></div>
  <div class="fld">Tanggal
    <div class="dates"><label class="dbox"><small id="lblStart">${multi?"Naik":"Tanggal"}</small><input type="date" id="pStart" value="${esc(t.start)}" min="${today()}"></label>
    <label class="dbox ${multi?"":"hidden"}" id="endWrap"><small>Turun</small><input type="date" id="pEnd" value="${esc(t.end)}" min="${addDays(t.start&&t.start>=today()?t.start:today(),1)}"></label></div>
    <div class="dur ${multi?"":"hidden"}" id="durRow"><button type="button" data-dstep="-1" aria-label="Kurangi satu hari">−</button><span id="dVal" data-n="${n}">${n} hari ${n-1} malam</span><button type="button" data-dstep="1" aria-label="Tambah satu hari">+</button></div>
    <p class="plan-err" id="durTxt"></p></div>`}
function readPlan(){const b=document.querySelector('[data-ptype][aria-pressed="true"]');const type=b?b.dataset.ptype:"multi";
  return {type,start:$("#pStart")?$("#pStart").value:"",end:type==="multi"&&$("#pEnd")?$("#pEnd").value:""}}
function updatePlanView(){
  const pl=readPlan(),err=planError(pl),dv=$("#dVal");if(!$("#durTxt"))return err;
  const multi=pl.type==="multi";
  $("#endWrap").classList.toggle("hidden",!multi);$("#durRow").classList.toggle("hidden",!multi);
  $("#lblStart").textContent=multi?"Naik":"Tanggal";
  if(dv&&!err&&pl.start&&pl.end&&dayCount(pl)>=2)dv.dataset.n=dayCount(pl);
  if(dv){const n=+dv.dataset.n||2;dv.textContent=`${n} hari ${n-1} malam`}
  $("#durTxt").textContent=err;
  return err;
}
function onPlanChange(src){
  // Jangan ubah apa pun saat tanggal masih setengah diketik (tahun 0002, 0020, ...)
  if(src&&src.type==="date"&&src.value&&!fullDate(src.value))return;
  const pl=readPlan(),pe=$("#pEnd");
  if(pe&&src&&src.id!=="pEnd"&&fullDate(pl.start)){
    pe.min=addDays(pl.start,1);
    if(pl.type==="multi"&&(!pe.value||pe.value<=pl.start))pe.value=addDays(pl.start,(+$("#dVal").dataset.n||2)-1);
  }
  const err=updatePlanView();
  if(!err&&S&&!$("#app").classList.contains("hidden")){const was=S.team.type;Object.assign(S.team,readPlan());save();if(was!==S.team.type&&S.team.mountain){if(S.team.type==="oneday"){const md=new Set(BASE.filter(x=>x.md).map(x=>x.k)),before=S.items.length;S.items=S.items.filter(i=>!(i.auto&&md.has(i.auto)&&!isPacked(i)));save();const r=before-S.items.length;if(r)toast(`${r} barang khusus menginap dihapus dari daftar, karena tidak wajib untuk tektok.`)}else{const n=prefill();if(n)toast(`${n} barang wajib untuk pendakian menginap ditambahkan.`)}}renderHeader();renderNav();renderRencanaInfo()}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-ptype]");
  if(b){b.parentElement.querySelectorAll("[data-ptype]").forEach(x=>x.setAttribute("aria-pressed",x===b));onPlanChange(b);return}
  const s=e.target.closest("[data-dstep]");
  if(s){const dv=$("#dVal"),n=Math.min(30,Math.max(2,(+dv.dataset.n||2)+(+s.dataset.dstep)));dv.dataset.n=n;
    const st=$("#pStart").value;if(fullDate(st))$("#pEnd").value=addDays(st,n-1);else toast("Pilih tanggal naik dulu, tanggal turun akan terisi otomatis.");
    onPlanChange(s)}
});
document.addEventListener("change",e=>{if(e.target.id==="pStart"||e.target.id==="pEnd")onPlanChange(e.target)});
document.addEventListener("focusout",e=>{if(e.target.id==="pStart"||e.target.id==="pEnd"){const err=updatePlanView();if(err)toast(err)}});

  const d=$("#mtDlg");
  d.innerHTML=`<div class="dlg mt-dlg"><div class="dlg-h"><h2 style="margin:0">Pilih gunung</h2><button class="x" data-mt="close" aria-label="Tutup">×</button></div>
  <input id="mtSearch" class="mt-search" type="search" placeholder="Cari nama gunung atau provinsi" autocomplete="off">
  <div id="mtList" class="mt-list"></div></div>`;
  const draw=q=>{q=norm(q).trim();let h="";
    PROV.forEach(([prov,list])=>{const provHit=!q||norm(prov).includes(q);
      const its=list.filter(([k,n])=>provHit||norm(n).includes(q));if(!its.length)return;
      h+=`<p class="mt-prov">${esc(prov)}</p>${its.map(([k,n])=>`<button class="mt-item ${S.team.mountain===k?"on":""}" data-mt="${k}">${esc(n)}${S.team.mountain===k?"<span>Dipilih</span>":""}</button>`).join("")}`});
    $("#mtList").innerHTML=h||`<p class="empty">Gunung tidak ditemukan. Coba kata lain.</p>`};
  draw("");$("#mtSearch").oninput=e=>draw(e.target.value);
  d.onclick=e=>{const b=e.target.closest("[data-mt]");if(!b)return;if(b.dataset.mt==="close"){d.close();return}

}

/* ---------- cek standar ---------- */
function checkStd(items,n,mid,type){
  const m=MT[mid];if(!m)return null;const one=type==="oneday";
  const wajib=[...BASE,...m.wajib].filter(s=>!(one&&s.md)).map(s=>{
    const need=s.per==="orang"?n:s.per==="n3"?Math.max(1,Math.ceil(n/3)):1;
    const have=items.filter(i=>hit(i,s.kw)).reduce((a,i)=>a+(+i.qty||0),0);
    return {...s,need,have,st:have===0?"red":have<need?"yellow":"green"}});
  const rekList=[...(one?BASE.filter(s=>s.md).map(s=>({n:s.n,kw:s.kw,sub:"Tidak wajib untuk tektok"})):[]),...REK];
  const rek=rekList.map(r=>({...r,st:items.some(i=>hit(i,r.kw))?"green":"gray"}));
  return {wajib,rek,red:wajib.filter(x=>x.st==="red").length,yellow:wajib.filter(x=>x.st==="yellow").length,green:wajib.filter(x=>x.st==="green").length};
}
const perTxt=s=>s.per==="orang"?"per orang":s.per==="n3"?"per 3 orang":"per tim";
const curStd=()=>checkStd(S.items,S.members.length,S.team.mountain,S.team.type);

function rowHTML(i,o={}){
  const own=o.owner?", "+esc(((o.members||S.members).find(m=>m.id===i.owner)||{}).name||""):"";
  const subs=i.subs||[],sd=subs.filter(s=>s.done).length,pk=isPacked(i);
  const meta=`${sizeTxt(i)}${own}${i.scope==="tim"?", barang tim":""}${i.color?", "+esc(i.color):""}`;
  const tags=(subs.length?`<span class="tag sub ${sd===subs.length?"ok":""}">${sd}/${subs.length} isi</span>`:"")+(i.required?'<span class="tag">Wajib</span>':"")+(o.dup?'<span class="tag dup">Duplikat</span>':"");
  const inner=`${i.photo?`<img src="${i.photo}" alt="">`:""}<span class="rt"><span class="rn">${esc(i.name)}</span><span class="rm">${meta}${i.note?" — "+esc(i.note):""}</span>${i.why&&!pk&&!o.ro?`<span class="rw">${esc(i.why)}</span>`:""}</span>${tags}`;
  if(o.ro)return `<div class="row ${pk?"packed":""}"><div class="rowmain">${inner}<span class="tag" style="background:${pk?"var(--greenbg)":"var(--bg)"};color:${pk?"var(--green)":"var(--muted)"}">${pk?"Dikemas":"Belum"}</span></div></div>${subs.length?`<div class="subs ro">${subs.map(s=>esc(s.n)).join(", ")}</div>`:""}`;
  const isOpen=open.has(i.id);
  return `<div class="row ${pk?"packed":""}"><button class="chk" data-act="pack" data-id="${i.id}" aria-label="Tandai ${esc(i.name)} dikemas" aria-pressed="${pk}"><span>${CHECK_SVG}</span></button><button class="rowmain" data-act="edit" data-id="${i.id}">${inner}</button>${subs.length?`<button class="expand" data-act="toggleopen" data-id="${i.id}" aria-expanded="${isOpen}" aria-label="Lihat isi">${isOpen?"▲":"▼"}</button>`:""}</div>
  ${subs.length&&isOpen?`<div class="subs">${subs.map((s,k)=>`<button class="subrow ${s.done?"done":""}" data-act="sub" data-id="${i.id}" data-k="${k}"><span class="sbox">${s.done?CHECK_SVG:""}</span>${esc(s.n)}</button>`).join("")}</div>`:""}`;
}
function mergedHTML(members,items,opts){
  const ro=!!opts.readonly;
  const byOwner=Object.fromEntries(members.map(m=>[m.id,0]));
  items.forEach(i=>{byOwner[i.owner]=(byOwner[i.owner]||0)+(+i.qty||0)*(+i.weight||0)});
  const total=Object.values(byOwner).reduce((a,b)=>a+b,0),max=Math.max(1,...Object.values(byOwner));
  const groups={};items.filter(i=>i.scope==="tim").forEach(i=>{const k=norm(i.name);(groups[k]=groups[k]||new Set()).add(i.owner)});
  const dup=new Set(Object.keys(groups).filter(k=>groups[k].size>1));
  const isDup=i=>i.scope==="tim"&&dup.has(norm(i.name));
  let list=items;
  if(opts.filter==="belum")list=items.filter(i=>!isPacked(i));
  if(opts.filter==="dup")list=items.filter(isDup);
  if(opts.filter==="wajib")list=items.filter(i=>i.required&&!isPacked(i));
  let h=`<div class="card"><h3 style="margin-top:0">Beban bawaan</h3><div class="wt">${members.map(m=>`<div class="wt-row"><span>${esc(m.name)}</span><div class="bar"><i style="width:${(byOwner[m.id]||0)/max*100}%"></i></div><b>${fmtW(byOwner[m.id]||0)}</b></div>`).join("")}</div>
  <div class="total"><span>Total berat${members.length>1?" tim":""}</span><b>${fmtW(total)}</b></div></div>`;
  if(!ro){
    const f=[["semua","Semua"],["belum","Belum dikemas"],["dup","Duplikat"+(dup.size?` (${dup.size})`:"")],["wajib","Wajib belum dikemas"]];
    h+=`<div class="seg" style="margin-top:16px"><button data-grp="anggota" aria-pressed="${opts.group==="anggota"}">Per anggota</button><button data-grp="kategori" aria-pressed="${opts.group==="kategori"}">Per kategori</button></div>
    <div class="chips">${f.map(([k,l])=>`<button class="chip ${opts.filter===k?"on":""}" data-flt="${k}">${l}</button>`).join("")}</div>`;
  }
  const secs=opts.group==="kategori"?CATS.map(c=>({t:c,its:list.filter(i=>i.cat===c)})):members.map(m=>({t:m.name,its:list.filter(i=>i.owner===m.id)}));
  const body=secs.filter(s=>s.its.length).map(s=>`<div class="grp"><div class="grp-h">${esc(s.t)}<small>${s.its.length} barang, ${fmtW(s.its.reduce((a,i)=>a+i.qty*i.weight,0))}</small></div><div class="rows ${ro?"ro":""}">${s.its.map(i=>rowHTML(i,{ro,owner:opts.group==="kategori",members,dup:isDup(i)})).join("")}</div></div>`).join("");
  return h+(body||`<div class="empty">Tidak ada barang untuk filter ini.</div>`);
}
function stdHTML(c,addable){
  return `<div class="sum3"><div style="background:var(--redbg);color:var(--red)"><b>${c.red}</b>belum ada</div><div style="background:var(--amberbg);color:var(--amber)"><b>${c.yellow}</b>kurang</div><div style="background:var(--greenbg);color:var(--green)"><b>${c.green}</b>sesuai</div></div>
  <h3>Wajib dibawa</h3><div class="rows">${c.wajib.map(s=>`<div class="std st-${s.st}"><span class="dot">${s.st==="green"?"✓":s.st==="yellow"?"!":"✕"}</span><span class="rt"><b>${esc(s.n)}</b><small>${s.st==="green"?`Sesuai (${s.have} dari ${s.need})`:s.st==="yellow"?`Kurang: ada ${s.have} dari ${s.need}`:`Belum ada, butuh ${s.need}`}, ${s.hint||perTxt(s)}</small></span>${addable&&s.st!=="green"?`<button class="btn sec sm" data-act="addstd" data-k="${s.k}" data-q="${s.need-s.have}">Tambah</button>`:""}</div>`).join("")}</div>

function idFail(msg,id){toast(msg);const el=$("#"+id);if(el){el.focus();el.scrollIntoView({block:"center"})}}
$("#idForm").addEventListener("click",e=>{

  const v=id=>$("#"+id).value.trim();
  const d={name:v("iName"),idType:v("iIdType"),idNo:v("iIdNo").toUpperCase().replace(/\s+/g,""),job:v("iJob"),phone:v("iPhone"),
    addrKtp:v("iAddrKtp"),sameAddr:$("#iSame").checked,addrDom:$("#iSame").checked?"":v("iAddrDom"),

  if(!d.name)return idFail("Nama lengkap wajib diisi.","iName");
  if(d.idNo){
    if(d.idType==="KTP"&&!/^\d{16}$/.test(d.idNo))return idFail("Nomor KTP (NIK) harus 16 angka.","iIdNo");
    if(d.idType==="SIM"&&!/^\d{10,16}$/.test(d.idNo))return idFail("Nomor SIM harus berupa angka (10 sampai 16 digit).","iIdNo");
    if(d.idType==="Paspor"&&!/^[A-Z0-9]{6,9}$/.test(d.idNo))return idFail("Nomor paspor terdiri dari 6 sampai 9 huruf atau angka.","iIdNo");
  }
  if(d.phone&&!PHONE_RE.test(d.phone))return idFail("Nomor HP belum benar. Contoh: 081234567890.","iPhone");
  if(!d.ec)return idFail("Nama kontak darurat wajib diisi.","iEc");
  if(!d.ecRel)return idFail("Pilih hubungan dengan kontak darurat.","iEcRel");
  if(!d.ecp)return idFail("Nomor HP kontak darurat wajib diisi.","iEcp");
  if(!PHONE_RE.test(d.ecp))return idFail("Nomor kontak darurat belum benar. Contoh: 081234567890.","iEcp");
  if(d.phone&&digits(d.phone)===digits(d.ecp))return idFail("Nomor kontak darurat harus berbeda dari nomor HP pendaki.","iEcp");

const tabsFor=()=>TABS.filter(t=>t[0]!=="tim"||S.role!=="solo");
function stepDone(){
  const t=S.team,c=curStd();
  return {rencana:!!(t.mountain&&t.start&&(t.type==="oneday"||t.end)&&!planError(t)),
    barang:S.items.length>0&&(!c||(c.red===0&&c.yellow===0)),
    tim:S.role==="solo"?true:!S.members.some(missingId),
    berangkat:!!S.famSent,mendaki:!!S.finished};
}
function renderNav(){
  const d=stepDone(),tabs=tabsFor(),nav=$("nav.bottom");

  nav.innerHTML=tabs.map(([k,l,ic],i)=>`<button data-tab="${k}" aria-current="${tab===k}"><span class="nav-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${d[k]?'<i class="nav-ok" aria-label="selesai"></i>':""}</span>${l}</button>`).join("");
}
function nextBtn(){
  const tabs=tabsFor(),i=tabs.findIndex(t=>t[0]===tab),n=tabs[i+1];

/* ---------- kartu pengenal pendaki ---------- */

const KEY_ITEMS=[["carrier","tas","ransel","backpack","daypack"],["jaket","jacket","polar","fleece"],["jas hujan","ponco","poncho","raincoat"],["tenda","tent","dome"],["sepatu","boots"],["sleeping bag","kantong tidur"]];
const keyRank=i=>{const k=KEY_ITEMS.findIndex(ks=>hitName(i.name,ks));return k<0?99:k};
function photoBtns(prefix){return `<span class="btn sec sm filebtn">${CAM_SVG} Kamera<input type="file" accept="image/*" capture="environment" data-photo="${prefix}"></span><span class="btn sec sm filebtn">Galeri<input type="file" accept="image/*" data-photo="${prefix}"></span>`}
function kartuHTML(){

  ${S.role==="leader"&&S.members.length>1?`<label class="fld" style="margin-bottom:10px">Kartu untuk<select id="kartuWhoSel">${S.members.map(x=>`<option value="${x.id}" ${x.id===kartuWho?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>`:""}
  <div class="outfit">${m.outfit?`<img src="${m.outfit}" alt="Foto ${esc(m.name)}">`:`<div class="ph-empty">${CAM_SVG}<span>Foto diri</span></div>`}
    <div class="stack" style="gap:8px;flex:1;min-width:0"><p class="small" style="margin:0"><b>Foto diri dengan pakaian mendaki</b><br><span class="muted">Seluruh badan, memakai jaket, sepatu, dan carrier.</span></p>
    <div class="photo-acts">${photoBtns("outfit")}${m.outfit?'<button class="btn sec sm" data-act="rmoutfit">Hapus</button>':""}</div></div></div>
  <label class="fld" style="margin-top:12px">Ciri pakaian<input id="outfitDesc" value="${esc(m.outfitDesc)}" maxlength="120" placeholder="mis. jaket merah, celana hitam, topi kuning"></label>

  <div class="kt-grid">${its.map(i=>`<button class="kt-tile" data-act="edit" data-id="${i.id}">${i.photo?`<img src="${i.photo}" alt="">`:`<span class="ph-empty">${CAM_SVG}</span>`}<b>${esc(i.name)}</b><small class="${i.color?"":"miss"}">${i.color?esc(i.color):"Warna belum diisi"}</small></button>`).join("")||'<p class="muted small">Belum ada barang.</p>'}</div>
  <button class="btn blaze full" data-act="mkkartu" style="margin-top:14px">Buat kartu pengenal</button><div id="kartuOut"></div></div>`;

function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function drawCover(x,img,dx,dy,dw,dh){const s=Math.max(dw/img.width,dh/img.height),sw=dw/s,sh=dh/s;x.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,dx,dy,dw,dh)}
function wrap(x,text,maxW){const words=String(text).split(/\s+/),out=[];let line="";words.forEach(w=>{const t=line?line+" "+w:w;if(x.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});if(line)out.push(line);return out}
async function makeKartu(){
  const m=S.members.find(x=>x.id===kartuWho),t=S.team,mt=MT[t.mountain];
  const its=S.items.filter(i=>i.owner===kartuWho).sort((a,b)=>keyRank(a)-keyRank(b));
  const withPh=its.filter(i=>i.photo),rest=its.filter(i=>!i.photo&&i.color);
  const W=1080,M=48,F="Barlow, Arial, sans-serif",FC="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif";
  const c=document.createElement("canvas"),x=c.getContext("2d");
  const info=[["Tim / pendakian",`${t.name}${S.role!=="solo"?" (kode "+t.code+")":""}`],["Gunung",mt?mt.n+", "+mt.loc:"-"],["Rencana",planTxt(t)],["HP pendaki",m.phone||"-"],
    ["Kontak darurat",m.ec?`${m.ec}${m.ecRel?" ("+m.ecRel+")":""}, ${m.ecp}`:"-"],["Golongan darah",m.blood||"-"],["Riwayat penyakit",m.health||"-"],["Alergi obat",m.allergy||"-"],
    ["Ciri pakaian",m.outfitDesc||"-"],["Kendaraan",m.plate||"-"]];
  const tx=M+360+36;x.font=`500 26px ${F}`;
  const infoLines=info.map(([k,v])=>[k,wrap(x,v,W-tx-M)]);
  const topH=Math.max(480,infoLines.reduce((a,[,l])=>a+30+l.length*32+10,0));
  const tile=(W-2*M-2*24)/3,tileH=tile+84,rows=Math.ceil(withPh.length/3);
  const restLines=rest.flatMap(i=>wrap(x,`• ${i.name}: ${i.color}`,W-2*M));
  const H=210+topH+40+(withPh.length?60+rows*(tileH+24):0)+(restLines.length?60+restLines.length*34:0)+110;
  c.width=W;c.height=H;
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#1F4D3A";x.fillRect(0,0,W,180);x.fillStyle="#E2642A";x.fillRect(0,180,W,10);
  x.fillStyle="#fff";x.font=`600 26px ${F}`;x.fillText("KARTU PENGENAL PENDAKI",M,62);x.font=`700 70px ${FC}`;x.fillText(m.name,M,140);
  let y=210;const outfit=await loadImg(m.outfit);
  x.fillStyle="#EDF0EB";x.fillRect(M,y,360,480);
  if(outfit)drawCover(x,outfit,M,y,360,480);else{x.fillStyle="#56655C";x.font=`500 26px ${F}`;x.textAlign="center";x.fillText("Foto diri",M+180,y+230);x.fillText("belum ada",M+180,y+262);x.textAlign="left"}
  let iy=y+26;
  infoLines.forEach(([k,l])=>{x.fillStyle="#56655C";x.font=`600 22px ${F}`;x.fillText(k.toUpperCase(),tx,iy);iy+=32;x.fillStyle="#15201A";x.font=`500 26px ${F}`;l.forEach(s=>{x.fillText(s,tx,iy);iy+=32});iy+=10});
  y+=topH+40;
  if(withPh.length){x.fillStyle="#15201A";x.font=`700 40px ${FC}`;x.fillText("Perlengkapan yang dibawa",M,y+36);y+=60;
    for(let k=0;k<withPh.length;k++){const i=withPh[k],cx=M+(k%3)*(tile+24),cy=y+Math.floor(k/3)*(tileH+24);
      const im=await loadImg(i.photo);x.fillStyle="#EDF0EB";x.fillRect(cx,cy,tile,tile);if(im)drawCover(x,im,cx,cy,tile,tile);
      x.fillStyle="#15201A";x.font=`600 26px ${F}`;x.fillText(wrap(x,i.name,tile)[0],cx,cy+tile+34);
      x.fillStyle="#B8352A";x.font=`500 23px ${F}`;x.fillText(wrap(x,i.color||"warna belum diisi",tile)[0],cx,cy+tile+66)}
    y+=rows*(tileH+24)}

function amtOf(i){if(i.aunit)return {amt:i.amt,au:i.aunit};const w=+i.weight||0;return w>=1000&&w%100===0?{amt:w/1000,au:"kg"}:{amt:w,au:"g"}}

const PRIVACY_VER="1.1";
const PRIVACY_HTML="<p class=\"pv-meta\">Berlaku sejak 2 Oktober 2026. Versi 1.1.</p>\n\n<p>Kebijakan ini menjelaskan data apa yang dikumpulkan aplikasi Siap Nanjak, di mana data itu disimpan, kapan data itu dibagikan, dan bagaimana kamu bisa menghapusnya. Siap Nanjak dibuat dan dikelola oleh <b>PT Mirai Internasional Indonesia</b>.</p>\n\n<div class=\"pv-box\"><b>Ringkasnya</b>\n<ul>\n<li>Semua data kamu disimpan <b>hanya di HP kamu sendiri</b>. Kami tidak punya server yang menyimpan data pribadi pengguna.</li>\n<li>Data baru keluar dari HP kamu kalau <b>kamu sendiri</b> yang membagikannya, misalnya lewat QR Code, link, SMS, atau gambar kartu pengenal.</li>\n<li>Lokasi GPS hanya diambil saat kamu menekan tombol darurat, dan tidak disimpan.</li>\n<li>Tidak ada iklan, tidak ada pelacakan, dan data kamu tidak pernah dijual.</li>\n<li>Kamu bisa menghapus semua data kapan saja dari dalam aplikasi.</li>\n</ul></div>\n\n<h2>1. Data yang dikumpulkan</h2>\n<p>Aplikasi hanya menyimpan data yang kamu isi sendiri:</p>\n<ul>\n<li><b>Data diri:</b> nama lengkap, jenis dan nomor identitas (KTP, paspor, atau SIM), pekerjaan, nomor HP, alamat sesuai KTP, dan alamat domisili.</li>\n<li><b>Kontak darurat:</b> nama, hubungan dengan kamu, dan nomor HP orang yang kamu tunjuk.</li>\n<li><b>Data kesehatan:</b> golongan darah, riwayat penyakit, dan alergi obat. Semuanya opsional.</li>\n<li><b>Data kendaraan:</b> plat nomor kendaraan yang kamu parkir di basecamp. Opsional.</li>\n<li><b>Rencana pendakian:</b> gunung tujuan, tanggal, nama tim, kode tim, anggota tim, dan nomor basecamp.</li>\n<li><b>Daftar barang:</b> nama barang, jumlah, berat, warna, catatan, dan isi barang.</li>\n<li><b>Foto:</b> foto barang dan foto diri dengan pakaian mendaki yang kamu ambil untuk kartu pengenal. Opsional.</li>\n<li><b>Catatan pendakian:</b> waktu kamu menekan tombol Mulai mendaki dan Sudah turun dengan selamat, serta apakah pesan rencana sudah dikirim ke keluarga.</li>\n</ul>\n<p><b>Lokasi GPS</b> hanya diambil ketika kamu sendiri menekan tombol <b>Ambil lokasi GPS</b> di menu darurat, setelah kamu memberi izin lokasi. Lokasi itu hanya dimasukkan ke pesan SMS yang kamu kirim sendiri, dan tidak disimpan oleh aplikasi. Aplikasi tidak mengambil daftar kontak atau data lain dari HP kamu.</p>\n\n<h2>2. Data tentang orang lain</h2>\n<p>Ketua tim dapat mengisi data anggota, dan setiap pengguna mengisi data kontak daruratnya. Sebelum mengisi data orang lain, pastikan orang tersebut <b>sudah tahu dan setuju</b> datanya dicatat dan dibagikan kepada petugas pendakian.</p>\n\n<h2>3. Tempat data disimpan</h2>\n<p>Semua data di atas disimpan di penyimpanan browser atau aplikasi di HP kamu. Data tidak dikirim ke server kami, karena kami tidak mengoperasikan server untuk menyimpan data pengguna.</p>\n<p>Ada beberapa layanan pihak ketiga yang digunakan untuk menjalankan aplikasi. Layanan ini tidak menerima data pribadi yang kamu isi, tetapi seperti situs web pada umumnya, mereka dapat menerima informasi teknis seperti alamat IP dan jenis perangkat saat aplikasi dimuat:</p>\n<ul>\n<li><b>Netlify:</b> layanan hosting yang menayangkan file aplikasi.</li>\n<li><b>Google Fonts:</b> penyedia huruf tampilan aplikasi.</li>\n<li><b>cdnjs (Cloudflare):</b> penyedia pustaka untuk membuat QR Code.</li>\n</ul>\n\n<h2>4. Kapan data dibagikan</h2>\n<p>Data hanya keluar dari HP kamu ketika kamu melakukan salah satu tindakan berikut:</p>\n<ul>\n<li><b>Menunjukkan atau membagikan QR Code registrasi.</b> QR berisi rencana pendakian, data diri, kontak darurat, data kesehatan, dan daftar barang seluruh anggota tim. Isi QR <b>tidak dienkripsi</b>, sehingga siapa pun yang memindainya dapat membacanya.</li>\n<li><b>Mengirim link daftar ke ketua tim</b> melalui WhatsApp atau aplikasi lain.</li>\n<li><b>Mengirim pesan WhatsApp atau SMS</b> berisi rencana pendakian, kabar, atau lokasi GPS saat darurat, ke kontak darurat, basecamp, atau nomor lain yang kamu pilih.</li>\n<li><b>Mengunduh atau mengirim kartu pengenal</b> sebagai gambar.</li>\n</ul>\n<p>Setelah dibagikan, data tersebut berada di luar kendali aplikasi dan tunduk pada kebijakan aplikasi yang kamu pakai untuk mengirimnya, seperti WhatsApp atau aplikasi SMS.</p>\n\n<h2>5. Penggunaan kamera dan lokasi</h2>\n<p>Kamera hanya digunakan saat kamu menekan tombol untuk mengambil foto barang atau foto diri. Gambar diproses langsung di HP kamu dan tidak diunggah ke mana pun. Kamu bisa mencabut izin kamera dan lokasi kapan saja di pengaturan HP.</p>\n\n<h2>6. Menjaga keamanan data</h2>\n<ul>\n<li>Kunci HP kamu dengan PIN, pola, atau sidik jari, karena data tersimpan di HP.</li>\n<li>Tunjukkan QR Code hanya kepada petugas registrasi atau pos resmi.</li>\n<li>Jangan mengunggah QR Code atau kartu pengenal ke media sosial.</li>\n<li>Kirim kartu pengenal hanya kepada keluarga atau petugas yang kamu percaya.</li>\n</ul>\n\n<h2>7. Berapa lama data disimpan dan cara menghapusnya</h2>\n<p>Data tersimpan di HP kamu sampai kamu menghapusnya. Kamu bisa:</p>\n<ul>\n<li>menghapus satu pendakian lewat tombol <b>Hapus pendakian ini</b>;</li>\n<li>menghapus seluruh data lewat tombol <b>Hapus semua data di HP ini</b> di menu utama;</li>\n<li>menghapus data aplikasi atau browser di pengaturan HP, atau menghapus aplikasinya.</li>\n</ul>\n<p>Karena tidak ada salinan di server, data yang sudah dihapus <b>tidak bisa dipulihkan</b>. Data yang sudah kamu bagikan kepada orang lain juga tidak ikut terhapus.</p>\n\n<h2>8. Hak kamu</h2>\n<p>Sesuai Undang-Undang Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi, kamu berhak mengetahui, melihat, memperbarui, dan menghapus data pribadimu, serta menarik persetujuan yang sudah diberikan. Karena seluruh data ada di HP kamu, semua hak ini bisa kamu jalankan langsung dari dalam aplikasi: lihat dan ubah lewat menu <b>Data diri</b>, dan hapus lewat tombol hapus yang dijelaskan di atas.</p>\n\n<h2>9. Pengguna di bawah 18 tahun</h2>\n<p>Siap Nanjak ditujukan untuk pengguna berusia 18 tahun ke atas. Pengguna di bawah 18 tahun hanya boleh menggunakan aplikasi ini dengan persetujuan dan pendampingan orang tua atau wali.</p>\n\n<h2>10. Batasan informasi di aplikasi</h2>\n<p>Standar perlengkapan, daftar gunung, dan panduan keselamatan di aplikasi ini adalah informasi umum. Aturan resmi dapat berbeda dan berubah sewaktu-waktu. Selalu ikuti aturan pengelola gunung dan arahan petugas basecamp atau tim SAR.</p>\n\n<h2>11. Perubahan kebijakan</h2>\n<p>Kebijakan ini dapat diperbarui, misalnya jika nanti aplikasi menambahkan fitur penyimpanan cadangan di server. Jika ada perubahan penting, kami akan memberi tahu di dalam aplikasi dan meminta persetujuanmu kembali sebelum perubahan berlaku.</p>\n\n<h2>12. Hubungi kami</h2>\n<p>Untuk pertanyaan tentang kebijakan ini atau data pribadimu, hubungi <b>PT Mirai Internasional Indonesia</b> melalui email <a href=\"mailto:contact@mirai.co.id\">contact@mirai.co.id</a>.</p>\n";

function packTeam(lite){syncMe();const idx=Object.fromEntries(S.members.map((m,i)=>[m.id,i]));const t=S.team;
  return {v:3,t:t.name,c:t.code,g:t.mountain,ty:t.type,d:t.start,e:t.end,ds:t.desc,rt:t.back||"",tu:t.turn||"",
    m:S.members.map(m=>[m.name,...idVals(m,lite),m.outfitDesc||""]),
    i:S.items.map(i=>[i.name,CATS.indexOf(i.cat),+i.qty||1,Math.round(+i.weight||0),idx[i.owner]??0,i.scope==="tim"?1:0,isPacked(i)?1:0,i.required?1:0,i.color||"",lite?"":subStr(i),unitStr(i)])}}
function unpackTeam(p){const members=p.m.map((x,k)=>{if(!Array.isArray(x))return {id:"m"+k,name:x};
    const m={id:"m"+k,name:x[0]};ID_FIELDS.forEach((f,j)=>m[f]=f==="sameAddr"?!!x[j+1]:(x[j+1]||""));m.outfitDesc=x[ID_FIELDS.length+1]||"";return m});
  return {team:{name:p.t,code:p.c,mountain:p.g,type:p.ty||"multi",start:p.d||"",end:p.e||"",desc:p.ds,back:p.rt||"",turn:p.tu||""},members,
    items:p.i.map((a,k)=>applyUnitStr({id:"i"+k,name:a[0],cat:CATS[a[1]]||"Lainnya",qty:a[2],weight:a[3],owner:"m"+a[4],scope:a[5]?"tim":"pribadi",packed:!!a[6],required:!!a[7],color:a[8]||"",
      subs:a[9]?String(a[9]).split(", ").map(n=>({n,done:!!a[6]})):[]},a[10]))}}

let qrLink="",qrLite="";
function drawQR(){
  const out=$("#qrOut");if(!out)return;
  if(!window.QRCode||!window.LZString){out.innerHTML=`<p class="note">Pembuat QR belum termuat. Pastikan HP tersambung internet saat pertama membuka aplikasi.</p>`;return}
  out.innerHTML=`<div class="qrbox"><div class="qn">${esc(S.team.name)}</div><div id="qrc"></div><div class="small" style="text-align:center">Kode tim ${esc(S.team.code)}, ${S.members.length} pendaki<br>${esc(planTxt(S.team))}</div></div>
  <div class="acts noprint"><button class="btn sec" data-act="dlqr">Unduh PNG</button><button class="btn sec" data-act="shareqr">Bagikan link</button><button class="btn sec" data-act="print">Cetak / PDF</button><button class="btn sec" data-act="preview">Tampilan petugas</button></div>`;
  const mk=t=>{$("#qrc").innerHTML="";new QRCode($("#qrc"),{text:t,width:300,height:300,correctLevel:QRCode.CorrectLevel.L})};
  try{mk(qrLink)}catch(e){
    try{mk(qrLite);qrLink=qrLite;out.insertAdjacentHTML("afterbegin",`<p class="note" style="margin-bottom:10px">Data terlalu banyak untuk satu QR, jadi alamat, pekerjaan, dan isi barang tidak dimasukkan. Data penting lain tetap ada.</p>`)}
    catch(e2){out.innerHTML=`<p class="note">Daftar terlalu panjang untuk satu QR. Coba gabungkan barang serupa lalu buat ulang.</p>`;qrLink=""}}
}
async function saveFile(name,blob){
  try{if(window.claude&&typeof window.claude.use==="function"){const d=await window.claude.use("downloads");if(d){await d.save({filename:name,data:blob});return}}}
  catch(e){if(e&&e.code==="declined")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
async function shareLink(text,url){
  if(navigator.share){try{await navigator.share({title:"Siap Nanjak",text,url});return}catch(e){if(e&&e.name==="AbortError")return}}
  window.open("https://wa.me/?text="+encodeURIComponent(text+"\n"+url),"_blank","noopener");
}
async function copy(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch(e){toast("Kode tim: "+t)}}

  ${S.role!=="solo"?`<label class="fld">Jenis<select id="fScope"><option value="pribadi" ${i.scope==="pribadi"?"selected":""}>Barang pribadi</option><option value="tim" ${i.scope==="tim"?"selected":""}>Barang bersama tim</option></select></label>`:""}
  ${S.role==="leader"?`<label class="fld">Dibawa oleh<select id="fOwner">${S.members.map(m=>`<option value="${m.id}" ${m.id===i.owner?"selected":""}>${esc(m.name)}</option>`).join("")}</select></label>`:""}
  <label class="fld">Warna / ciri khusus<input id="fColor" value="${esc(i.color)}" maxlength="60" placeholder="mis. oranye, ada gantungan biru"></label>
  <div class="fld">Foto barang <span class="small muted" style="font-weight:400">opsional, dipakai di kartu pengenal</span>
  <div class="photo-prev" id="fPhotoBox">${formPhoto?`<img src="${formPhoto}" alt="">`:""}<div class="photo-acts">${photoBtns("item")}${formPhoto?'<button class="btn sec sm" data-f="nophoto">Hapus foto</button>':""}</div></div></div>
  <label class="fld">Catatan (opsional)<input id="fNote" value="${esc(i.note)}" maxlength="80"></label>
  </div></details>
  ${i.why?`<p class="tip">${esc(i.why)}</p>`:""}
  <label class="check"><input type="checkbox" id="fReq" ${i.required?"checked":""}> Tandai wajib dibawa</label>
  <div class="dlg-foot"><button class="btn pri full" data-f="save">Simpan</button>${item?'<button class="btn sec full" data-f="del" style="color:var(--red);margin-top:8px">Hapus barang</button>':""}</div>`;
  $("#subIn").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addSub()}};
  const unitLbl=()=>{const v=["ml","L"].includes($("#fU").value);$("#fWl").textContent=(v?"Isi":"Berat")+" per "+$("#fQU").value;$("#fWhint").textContent=v?"Berat dihitung perkiraan: 1 liter ± 1 kg.":""};
  $("#fU").onchange=unitLbl;$("#fQU").onchange=unitLbl;
  $("#itemDlg").showModal();if(!item)setTimeout(()=>$("#fName").focus(),50);
}
function addSub(){const inp=$("#subIn");const parts=inp.value.split(/[,\n;]/).map(s=>s.trim()).filter(Boolean);if(!parts.length)return;
  parts.forEach(n=>{if(!formSubs.some(s=>s.n.toLowerCase()===n.toLowerCase()))formSubs.push({n,done:false})});inp.value="";$("#subList").innerHTML=subsHTML();inp.focus()}
document.addEventListener("change",async e=>{const inp=e.target.closest("[data-photo]");if(!inp||!inp.files[0])return;
  const kind=inp.dataset.photo,src=await resize(inp.files[0],kind==="outfit"?640:480);inp.value="";if(!src){toast("Foto tidak bisa dibaca.");return}
  if(kind==="item"){formPhoto=src;const b=$("#fPhotoBox");b.querySelector("img")?b.querySelector("img").src=src:b.insertAdjacentHTML("afterbegin",`<img src="${src}" alt="">`)}
  if(kind==="outfit"){const m=S.members.find(x=>x.id===kartuWho);m.outfit=src;save();renderBerangkat();$("#kartuSec").scrollIntoView({block:"start"});toast("Foto disimpan.")}
});
function resize(file,max=480){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};
  im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u})}
$("#itemForm").addEventListener("click",async e=>{
  const a=e.target.closest("[data-f]");if(!a)return;const f=a.dataset.f;
  if(f==="close"){$("#itemDlg").close();return}
  if(f==="addsub"){addSub();return}
  if(f==="rmsub"){formSubs.splice(+a.dataset.k,1);$("#subList").innerHTML=subsHTML();return}
  if(f==="nophoto"){formPhoto=null;const b=$("#fPhotoBox");b.querySelector("img")?.remove();a.remove();return}
  if(f==="del"){$("#itemDlg").close();if(await ask(`Hapus "${editing.name}" dari daftar?`,"Hapus")){S.items=S.items.filter(x=>x.id!==editing.id);save();setTab(tab)}return}
  if(f==="save"){const name=$("#fName").value.trim();if(!name){toast("Isi nama barang.");return}
    if($("#subIn").value.trim())addSub();
    const amt=+$("#fW").value||0,au=$("#fU").value;
    const d={name,color:$("#fColor").value.trim(),cat:$("#fCat").value,qty:Math.max(1,parseInt($("#fQty").value)||1),qunit:$("#fQU").value,amt,aunit:au,weight:Math.round(toGrams(amt,au)),note:$("#fNote").value.trim(),required:$("#fReq").checked,photo:formPhoto,subs:formSubs,
      scope:$("#fScope")?$("#fScope").value:"pribadi",owner:$("#fOwner")?$("#fOwner").value:(editing?editing.owner:S.me)};
    const wasEdit=!!editing;
    if(editing){Object.assign(editing,d);if(d.subs.length)editing.packed=isPacked(editing)}else{S.items.push({id:uid(),packed:false,...d})}
    save();$("#itemDlg").close();setTab(tab);toast(wasEdit?"Perubahan disimpan.":"Barang ditambahkan.");}
});

$("#app").addEventListener("click",async e=>{
  const tb=e.target.closest("main [data-tab]");if(tb){setTab(tb.dataset.tab);window.scrollTo(0,0);return}
  const bv=e.target.closest("[data-bview]");if(bv){bview=bv.dataset.bview;renderBarang();return}
  const sc=e.target.closest("[data-scope]");if(sc){scope=sc.dataset.scope;renderBarang();return}
  const q=e.target.closest("[data-quick]");if(q){const d=QUICK.find(x=>x.n===q.dataset.quick);
    const it={id:uid(),name:d.n,cat:d.cat,qty:1,weight:d.w,qunit:d.qu||"pcs",...(d.au?{aunit:d.au,amt:d.amt}:{}),note:"",color:"",required:false,photo:null,packed:false,subs:(d.subs||[]).map(n=>({n,done:false})),scope:S.role==="solo"?"pribadi":scope,owner:S.me};
    S.items.push(it);if(it.subs.length)open.add(it.id);save();renderBarang();renderNav();toast(d.n+" ditambahkan. Ketuk barangnya untuk mengubah detail.");return}
  const g=e.target.closest("[data-grp]");if(g){grp=g.dataset.grp;renderTim();return}
  const fl=e.target.closest("[data-flt]");if(fl){flt=fl.dataset.flt;renderTim();return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act,it=S.items.find(x=>x.id===a.dataset.id);
  if(act==="home"){renderHome();return}
  if(act==="gomendaki"){setTab("mendaki");window.scrollTo(0,0);return}
  if(act==="gofam"){$("#famSec").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(act==="famsent"){S.famSent=new Date().toISOString();save();setTimeout(()=>{renderNav();if(tab==="berangkat")renderBerangkat()},800);return}
  if(act==="prefill"){const n=prefill();renderBarang();renderNav();toast(n?`${n} barang wajib ditambahkan. Centang saat dikemas.`:"Semua barang wajib sudah ada di daftar.");return}
  if(act==="startclimb"){S.started=new Date().toISOString();save();renderMendaki();renderHeader();toast("Selamat mendaki! Tetap bersama rombongan.");return}
  if(act==="sos"){openSOS();return}
  if(act==="finishclimb"&&await ask("Kamu sudah tiba kembali di basecamp dengan selamat?","Ya, sudah turun")){S.finished=new Date().toISOString();save();renderMendaki();renderHeader();renderNav();toast("Syukurlah! Sekarang kabari keluarga dan basecamp.");return}
  if(act==="unfinish"){delete S.finished;save();renderMendaki();renderHeader();renderNav();return}
  if(act==="pickmt"){openMtPicker();return}
  if(act==="guide"){renderGuide("app");return}
  if(act==="gostd"){bview="standar";setTab("barang");window.scrollTo(0,0);return}
  if(act==="gotim"){setTab("tim");window.scrollTo(0,0);return}
  if(act==="add")openForm();
  if(act==="edit"&&it)openForm(it);
  if(act==="toggleopen"&&it){open.has(it.id)?open.delete(it.id):open.add(it.id);setTab(tab);return}
  if(act==="pack"&&it){const v=!isPacked(it);it.packed=v;(it.subs||[]).forEach(s=>s.done=v);save();setTab(tab)}
  if(act==="sub"&&it){const s=it.subs[+a.dataset.k];s.done=!s.done;it.packed=isPacked(it);save();setTab(tab)}
  if(act==="editid")openIdentity(a.dataset.id);
  if(act==="addstd"){const s=[...BASE,SEHAT,SARUNG,KUPLUK].find(x=>x.k===a.dataset.k);openForm(null,{name:s.n,cat:s.cat,qty:Math.max(1,+a.dataset.q||1),weight:s.w,qunit:s.qu||"pcs",...(s.au?{aunit:s.au,amt:s.amt}:{}),required:true,scope:S.role==="leader"&&s.per!=="orang"?"tim":"pribadi"})}
  if(act==="copycode")copy(S.team.code,"Kode tim disalin.");
  if(act==="sharecode")shareLink(`Gabung ke tim pendakian "${S.team.name}" di Siap Nanjak. Kode tim: ${S.team.code}`,baseURL());
  if(act==="addmem"){const n=$("#newMem").value.trim();if(!n)return;S.members.push({id:uid(),name:n,...blankId()});save();renderTim();renderNav();toast(n+" ditambahkan. Ketuk Ubah untuk mengisi data dirinya.")}
  if(act==="rmmem"){const m=S.members.find(x=>x.id===a.dataset.id);const c=S.items.filter(i=>i.owner===m.id).length;
    if(await ask(`Hapus ${m.name} dari tim?${c?` ${c} barang miliknya ikut terhapus.`:""}`,"Hapus")){S.members=S.members.filter(x=>x.id!==m.id);S.items=S.items.filter(i=>i.owner!==m.id);save();renderTim();renderNav()}}
  if(act==="deltrip"&&await ask(`Hapus "${S.team.name}" beserta semua daftar barangnya dari HP ini?`,"Hapus")){DB.trips=DB.trips.filter(t=>t.id!==S.id);renderHome();toast("Pendakian dihapus.")}
  if(act==="sendleader"){syncMe();const p=DB.profile;
    if(missingId(p)){toast("Isi kontak darurat dulu sebelum mengirim ke ketua.");openIdentity(p.id);return}
    const mm=S.members.find(x=>x.id===S.me)||{};
    const payload=enc({v:3,c:S.team.code,n:p.name,id:idVals(p),od:mm.outfitDesc||"",i:S.items.map(i=>[i.name,CATS.indexOf(i.cat),i.qty,i.weight,i.scope==="tim"?1:0,isPacked(i)?1:0,i.required?1:0,i.color||"",subStr(i),unitStr(i)])});
    if(!payload){toast("Perlu koneksi internet untuk membuat link.");return}
    shareLink(`Daftar perlengkapan ${p.name} untuk tim ${S.team.code}. Ketua, buka link ini di HP-mu:`,baseURL()+"#gabung="+payload)}
  if(act==="genqr"){const p=enc(packTeam());if(!p){toast("Perlu koneksi internet untuk membuat QR.");return}qrLink=baseURL()+"#cek="+p;qrLite=baseURL()+"#cek="+enc(packTeam(true));drawQR();if(qrLink){a.textContent="Perbarui QR Code";toast("QR Code dibuat.")}}
  if(act==="dlqr"){const src=$("#qrc canvas");if(!src)return;const W=720,c=document.createElement("canvas");c.width=W;c.height=W+200;const x=c.getContext("2d");
    x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.imageSmoothingEnabled=false;x.drawImage(src,60,110,W-120,W-120);
    x.fillStyle="#15201A";x.textAlign="center";x.font="700 44px 'Barlow Condensed', Arial";x.fillText(S.team.name,W/2,70);
    x.font="500 26px Barlow, Arial";x.fillText(`Kode tim ${S.team.code}, ${S.members.length} pendaki, ${mtName(S.team.mountain)}`,W/2,W+50);
    x.fillText(planTxt(S.team),W/2,W+90);
    c.toBlob(b=>saveFile(`QR-${S.team.code}.png`,b),"image/png")}
  if(act==="shareqr")shareLink(`Data registrasi tim "${S.team.name}" (${S.team.code})`,qrLink);

  if(act==="addbag"){openForm(null,{name:"Carrier / tas gunung",cat:"Pribadi",weight:1800,owner:kartuWho,scope:"pribadi"});return}
  if(act==="mkkartu"){const od=$("#outfitDesc");if(od){const m=S.members.find(x=>x.id===kartuWho);m.outfitDesc=od.value.trim();save()}
    a.disabled=true;a.textContent="Membuat kartu…";try{kartu=await makeKartu()}catch(err){toast("Kartu gagal dibuat.")}a.disabled=false;a.textContent="Buat ulang kartu pengenal";
    if(kartu)$("#kartuOut").innerHTML=`<img class="kt-prev" src="${kartu.url}" alt="Pratinjau kartu pengenal"><div class="acts"><button class="btn sec" data-act="dlkartu">Unduh gambar</button><button class="btn pri" data-act="sharekartu">Kirim ke keluarga</button></div>`;return}

    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Kartu pengenal pendaki",text:`Kartu pengenal ${memName(kartuWho)}, ${mtName(S.team.mountain)}, ${planTxt(S.team)}.`})}catch(err){}}
    else{toast("HP ini belum mendukung kirim langsung. Gambar diunduh, silakan kirim manual lewat WhatsApp.");saveFile(f.name,kartu.blob)}return}

/* ---------- tampilan petugas ---------- */
function renderOfficer(p,fromApp){
  const d=unpackTeam(p),m=MT[d.team.mountain],c=checkStd(d.items,d.members.length,d.team.mountain,d.team.type),o=$("#officer");
  const packed=d.items.filter(isPacked).length;
  o.innerHTML=`<div class="off-banner">Tampilan petugas registrasi</div><header class="top"><svg class="topo"><use href="#topo"/></svg><div class="wrap"><p class="hdr-sub">Tim pendakian, kode ${esc(d.team.code)}</p><h1>${esc(d.team.name)}</h1><p class="hdr-meta">${esc(m?m.n+", "+m.loc:"Gunung belum dipilih")}<br>${esc(planTxt(d.team))}${d.team.back?`<br>Rencana kembali di basecamp jam ${esc(d.team.back.replace(":","."))}${d.team.turn?`, mulai turun paling lambat jam ${esc(d.team.turn.replace(":","."))}`:""}`:""}</p>${d.team.desc?`<p class="hdr-meta">${esc(d.team.desc)}</p>`:""}</div></header>
  <div class="wrap"><div class="card"><h3 style="margin-top:0">Anggota (${d.members.length})</h3>${d.members.map(x=>{const l=idLine(x);return `<div class="mem" style="align-items:flex-start"><span class="av">${initial(x.name)}</span><span style="flex:1;min-width:0"><b>${esc(x.name)}</b><span class="small muted" style="display:block">${l.length?l.join("<br>"):"Data diri belum diisi"}</span></span><span class="muted small">${d.items.filter(i=>i.owner===x.id).length} barang</span></div>`}).join("")}
  <p class="muted small" style="margin:10px 0 0">${packed} dari ${d.items.length} barang sudah ditandai dikemas.</p></div>
  ${c?`<h3>Kesesuaian standar ${esc(m.n)}</h3>`+stdHTML(c,false):""}
  <h3>Perlengkapan per anggota</h3>${mergedHTML(d.members,d.items,{group:"anggota",filter:"semua",readonly:true})}
  <div class="noprint" style="margin-top:24px">${fromApp?'<button class="btn pri full" id="offBack">Kembali ke aplikasi</button>':'<button class="btn sec full" id="offBack">Buka aplikasi Siap Nanjak</button>'}</div></div>`;
  show("officer");
  $("#offBack").onclick=()=>{if(fromApp&&S){renderApp();return}history.replaceState(null,"",baseURL());DB=DB||load();if(!DB)renderOnboard();else renderHome()};
}

/* ---------- terima daftar anggota ---------- */
async function importMember(p){
  if(!DB){renderOnboard();setTimeout(()=>toast("Link ini untuk ketua tim. Buka di HP ketua yang membuat tim."),300);return}
  const trip=DB.trips.find(t=>t.role==="leader"&&t.team.code===p.c);
  if(!trip){renderHome();setTimeout(()=>toast(`Tidak ada tim berkode ${p.c} yang kamu pimpin di HP ini.`),300);return}
  S=trip;tab="tim";renderApp();
  if(!(await ask(`Tambahkan daftar ${p.n} (${p.i.length} barang) ke tim ${trip.team.name}?`,"Tambahkan")))return;
  let m=S.members.find(x=>x.name.trim().toLowerCase()===String(p.n).trim().toLowerCase());
  if(!m){m={id:uid(),name:p.n,...blankId()};S.members.push(m)}
  if(Array.isArray(p.id))ID_FIELDS.forEach((f,k)=>{if(p.id[k])m[f]=f==="sameAddr"?!!p.id[k]:p.id[k]});
  if(p.od)m.outfitDesc=p.od;
  S.items=S.items.filter(i=>i.owner!==m.id).concat(p.i.map(a=>applyUnitStr({id:uid(),name:a[0],cat:CATS[a[1]]||"Lainnya",qty:a[2],weight:a[3],scope:a[4]?"tim":"pribadi",packed:!!a[5],required:!!a[6],color:a[7]||"",
    subs:a[8]?String(a[8]).split(", ").map(n=>({n,done:!!a[5]})):[],owner:m.id,note:"",photo:null},a[9])));
  save();renderTim();renderNav();toast(`Daftar ${p.n} masuk ke tim.`);
}

/* ---------- mulai ---------- */
function init(){
  DB=load();
  const h=location.hash;
  if(h.startsWith("#cek=")||h.startsWith("#gabung=")){
    if(!window.LZString){document.body.insertAdjacentHTML("afterbegin",'<p class="note" style="margin:16px">Butuh koneksi internet untuk membuka data ini. Muat ulang halaman setelah tersambung.</p>');return}
    const p=dec(h.slice(h.indexOf("=")+1));
    if(p&&h.startsWith("#cek=")&&Array.isArray(p.m)){renderOfficer(p,false);return}
    if(p&&h.startsWith("#gabung=")&&Array.isArray(p.i)){history.replaceState(null,"",baseURL());importMember(p);return}
    toast("Link tidak bisa dibaca. Minta dikirim ulang.");
  }
  if(!DB){introSeen()?renderOnboard():renderIntro();return}
  S=DB.trips.find(t=>t.id===DB.cur)||null;
  if(S)tab=stepDone().rencana||S.role==="member"?"barang":"rencana";
  S?renderApp():renderHome();
}
init();
window.addEventListener("hashchange",()=>{if(location.hash.startsWith("#cek=")||location.hash.startsWith("#gabung=")){DB=load();init()}});
})();
</script>
